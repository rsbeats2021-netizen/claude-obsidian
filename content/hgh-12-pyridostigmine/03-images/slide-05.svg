<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 348" width="940" height="348"><rect width="940" height="348" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Pyridostigmine across two GHRH pulses</text><text x="470" y="82" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">Spoudeas et al. 1992. Same background, two stimuli.</text><text x="90" y="128" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">First GHRH pulse</text><rect x="90" y="140" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="140" width="545" height="42" rx="12" fill="#1E8E4A"/><text x="710" y="170" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">enhanced</text><text x="90" y="214" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Second GHRH pulse, 90 min later</text><rect x="90" y="226" width="600" height="42" rx="12" fill="#DAD8D2"/><text x="710" y="256" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">not augmented</text><text x="470" y="328" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="middle">This is the finding nobody quotes.</text></svg>