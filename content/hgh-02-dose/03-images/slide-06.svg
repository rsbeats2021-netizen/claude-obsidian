<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Did the high dose burn through the plates faster?</text><text x="470" y="104" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#8A8A8A" text-anchor="middle">Bone age advance per chronological year</text><text x="90" y="150" font-family="Figtree,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#141414" text-anchor="start">Standard dose</text><rect x="90" y="164" width="700" height="48" rx="12" fill="#DAD8D2"/><rect x="90" y="164" width="700" height="48" rx="12" fill="#8A8A8A"/><text x="440" y="196" font-family="Figtree,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">~1.0 year</text><text x="90" y="258" font-family="Figtree,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#141414" text-anchor="start">High dose</text><rect x="90" y="272" width="700" height="48" rx="12" fill="#DAD8D2"/><rect x="90" y="272" width="700" height="48" rx="12" fill="#E0243B"/><text x="440" y="304" font-family="Figtree,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">~1.0 year</text><text x="470" y="420" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#141414" text-anchor="middle">No difference. The paper: high dose GH</text><text x="470" y="456" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#1E8E4A" text-anchor="middle">did not increase the rate of skeletal maturation.</text><text x="470" y="504" font-family="Figtree,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#8A8A8A" text-anchor="middle">Mauras et al. 2000.</text></svg>