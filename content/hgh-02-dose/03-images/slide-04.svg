<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="46" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">More than double the dose, in a randomised trial</text><rect x="70" y="90" width="360" height="170" rx="12" fill="#E8E8E6"/><text x="250" y="130" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#8A8A8A" text-anchor="middle">STANDARD</text><text x="250" y="186" font-family="Figtree,Helvetica,sans-serif" font-size="54" font-weight="800" fill="#141414" text-anchor="middle">0.3</text><text x="250" y="218" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">mg/kg/week</text><rect x="510" y="90" width="360" height="170" rx="12" fill="#E6D6D6"/><text x="690" y="130" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#E0243B" text-anchor="middle">HIGH DOSE</text><text x="690" y="186" font-family="Figtree,Helvetica,sans-serif" font-size="54" font-weight="800" fill="#E0243B" text-anchor="middle">0.7</text><text x="690" y="218" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">mg/kg/week</text><text x="470" y="310" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#8A8A8A" text-anchor="middle">difference at near-adult height</text><text x="470" y="380" font-family="Figtree,Helvetica,sans-serif" font-size="66" font-weight="800" fill="#E0243B" text-anchor="middle">4.6 cm</text><text x="470" y="418" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">P &lt; 0.001,  n = 75</text><text x="470" y="468" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">5.7 cm in those treated 4+ years (n = 20)</text><text x="470" y="504" font-family="Figtree,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#8A8A8A" text-anchor="middle">Mauras et al. 2000, JCEM. GH-deficient adolescents.</text></svg>