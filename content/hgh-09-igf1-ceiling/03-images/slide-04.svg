<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="46" font-family="Figtree,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#141414" text-anchor="middle">Where clinics cap IGF-1</text><text x="470" y="84" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">IGF-1, standard deviations above the mean for age and sex</text><rect x="110" y="150" width="740" height="66" rx="12" fill="#E8E8E6"/><rect x="110" y="150" width="458" height="66" rx="12" fill="#CFE0F5"/><rect x="110" y="150" width="592" height="66" rx="0" fill="#F3E2B8"/><rect x="110" y="150" width="458" height="66" rx="12" fill="#CFE0F5"/><line x1="110" y1="140" x2="110" y2="228" stroke="#8A8A8A" stroke-width="4"/><text x="110" y="264" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#8A8A8A" text-anchor="middle">0</text><line x1="568" y1="140" x2="568" y2="228" stroke="#1B4DE4" stroke-width="4"/><text x="568" y="264" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#1B4DE4" text-anchor="middle">2 SDS</text><line x1="702" y1="140" x2="702" y2="228" stroke="#E0243B" stroke-width="4"/><text x="702" y="264" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#E0243B" text-anchor="middle">3 SDS</text><text x="120" y="192" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">normal range</text><text x="470" y="320" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#1B4DE4" text-anchor="middle">2 SDS: the standing recommendation. Not to be exceeded.</text><text x="470" y="356" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#E0243B" text-anchor="middle">3 SDS: tolerated short term, first two years only.</text><rect x="70" y="384" width="800" height="86" rx="12" fill="#EFE6C8"/><text x="470" y="418" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="middle">"Currently, the recommended use of IGF-1 is as a</text><text x="470" y="446" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="middle">long-term safety marker for patients treated with GH."</text><text x="470" y="502" font-family="Figtree,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#8A8A8A" text-anchor="middle">Ly et al. 2020. Swedish national guidelines 2020.</text></svg>