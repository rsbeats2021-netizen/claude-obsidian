<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">The dose you swallow is not the dose you absorb</text><rect x="60" y="150" width="387" height="130" rx="12" fill="#E8E8E6"/><text x="253" y="200" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">TAKEN FASTED</text><text x="253" y="232" font-family="Figtree,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#8A8A8A" text-anchor="middle">baseline absorption</text><line x1="455" y1="215" x2="485" y2="215" stroke="#141414" stroke-width="5" stroke-linecap="round"/><path d="M485 215 L475 207 M485 215 L475 223" stroke="#141414" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="493" y="150" width="387" height="130" rx="12" fill="#E8E8E6"/><text x="686" y="200" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">WITH ~20 g FAT</text><text x="686" y="232" font-family="Figtree,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#1E8E4A" text-anchor="middle">absorption roughly doubles</text><text x="470" y="350" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="middle">A bigger difference than most of the dosing debates.</text></svg>