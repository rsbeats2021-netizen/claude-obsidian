<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420"><rect width="940" height="420" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Hunziker 1994</text><text x="470" y="82" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">GH versus IGF-1 treatment</text><rect x="70" y="112" width="400" height="230" rx="12" fill="#E8E8E6"/><text x="270" y="154" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="middle">CIRCULATING IGF-1</text><rect x="160" y="180" width="220" height="40" rx="12" fill="#DAD8D2"/><rect x="160" y="180" width="136" height="40" rx="12" fill="#E0243B"/><text x="270" y="268" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#E0243B" text-anchor="middle">lower on GH</text><rect x="490" y="112" width="400" height="230" rx="12" fill="#E8E8E6"/><text x="690" y="154" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="middle">GROWTH</text><rect x="580" y="180" width="220" height="40" rx="12" fill="#DAD8D2"/><rect x="580" y="180" width="220" height="40" rx="12" fill="#1E8E4A"/><text x="690" y="268" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#1E8E4A" text-anchor="middle">higher on GH</text><text x="470" y="392" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="middle">Lower blood number. More growth.</text></svg>