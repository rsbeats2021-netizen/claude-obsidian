<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="46" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Does the tissue care about the pattern?</text><text x="470" y="92" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">IGF-1 mRNA response to pulsatile vs continuous</text><text x="90" y="136" font-family="Figtree,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#141414" text-anchor="start">Liver</text><rect x="90" y="150" width="760" height="46" rx="12" fill="#E8E8E6"/><rect x="90" y="150" width="380" height="46" rx="12" fill="#8A8A8A"/><text x="90" y="224" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#8A8A8A" text-anchor="start">no significant difference</text><text x="90" y="256" font-family="Figtree,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#141414" text-anchor="start">Rib growth plate</text><rect x="90" y="270" width="760" height="46" rx="12" fill="#E8E8E6"/><rect x="90" y="270" width="623" height="46" rx="12" fill="#E0243B"/><text x="90" y="344" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#E0243B" text-anchor="start">pulsatile much more effective (P&lt;0.05)</text><text x="90" y="376" font-family="Figtree,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#141414" text-anchor="start">Skeletal muscle</text><rect x="90" y="390" width="760" height="46" rx="12" fill="#E8E8E6"/><rect x="90" y="390" width="760" height="46" rx="12" fill="#E0243B"/><text x="90" y="464" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#E0243B" text-anchor="start">3-5x increase; continuous had NO effect</text><text x="470" y="492" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">The liver makes IGF-1 either way. The growth plate needs the pulse.</text></svg>