<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="44" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Days per cell cycle (Hunziker 1994, rat)</text><text x="300" y="88" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#8A8A8A" text-anchor="middle">RESERVE CELLS</text><text x="690" y="88" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#8A8A8A" text-anchor="middle">DIVIDING CELLS</text><text x="90" y="156" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="start">No pituitary</text><rect x="300" y="128" width="250" height="48" rx="12" fill="#8A8A8A"/><text x="562" y="160" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="start">50d</text><rect x="640" y="128" width="190" height="48" rx="12" fill="#8A8A8A"/><text x="842" y="160" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="start">11d</text><text x="90" y="244" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="start">+ IGF-1</text><rect x="300" y="216" width="75" height="48" rx="12" fill="#1B4DE4"/><text x="387" y="248" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="start">15d</text><rect x="640" y="216" width="77" height="48" rx="12" fill="#1B4DE4"/><text x="729" y="248" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="start">4.5d</text><text x="90" y="332" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="start">+ GH</text><rect x="300" y="304" width="40" height="48" rx="12" fill="#E0243B"/><text x="352" y="33