<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">If you cannot make a perfect pulse</text><rect x="70" y="92" width="400" height="300" rx="12" fill="#E8E8E6"/><text x="270" y="134" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#141414" text-anchor="middle">SWITCH</text><text x="270" y="184" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#E0243B" text-anchor="middle">All or nothing</text><text x="270" y="226" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">partial pulsing</text><text x="270" y="268" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">buys you nothing</text><rect x="490" y="92" width="400" height="300" rx="12" fill="#DDEDE2"/><text x="690" y="134" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#141414" text-anchor="middle">DIAL</text><text x="690" y="184" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1E8E4A" text-anchor="middle">A gradient</text><text x="690" y="226" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">partial pulsing</text><text x="690" y="268" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">buys partial benefit</text><text x="470" y="448" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="middle">Gevers 1996 built the arm that tells them apart.</text></svg>