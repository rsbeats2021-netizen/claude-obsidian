<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="46" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Why splitting an injection is not a pulse</text><text x="90" y="106" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#E0243B" text-anchor="start">RAT STUDY: intravenous pulse</text><rect x="90" y="120" width="760" height="96" rx="12" fill="#E6D6D6"/><path d="M112 200 L120 136 L128 200 M204 200 L212 136 L220 200 M296 200 L304 136 L312 200 M388 200 L396 136 L404 200 M480 200 L488 136 L496 200 M572 200 L580 136 L588 200 M664 200 L672 136 L680 200 M756 200 L764 136 L772 200" stroke="#E0243B" stroke-width="6" fill="none" stroke-linejoin="round"/><text x="470" y="232" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#E0243B" text-anchor="middle">5 minutes per pulse. Sharp peak, real trough.</text><text x="90" y="284" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#1B4DE4" text-anchor="start">HUMAN TRIAL: subcutaneous, split in two</text><rect x="90" y="298" width="760" height="110" rx="12" fill="#CFE0F5"/><path d="M110 390 C 200 330, 300 330, 420 388 C 500 340, 610 330, 760 388" stroke="#1B4DE4" stroke-width="6" fill="none"/><text x="470" y="420" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1B4DE4" text-anchor="middle">Hours-long depot. Two slow humps, no trough.</text><text x="470" y="470" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#141414" text-anchor="middle">Lundberg 2015 found no height difference between them,</text><text x="470" y="502" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">because it never tested pulsatility.</text></svg>