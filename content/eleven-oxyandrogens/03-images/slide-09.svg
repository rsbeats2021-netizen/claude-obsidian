<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380"><rect width="940" height="380" fill="#F4F4F2"/><text x="470" y="52" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Where it becomes the dominant androgen</text><rect x="70" y="104" width="800" height="58" rx="12" fill="#E8E8E6"/><text x="112" y="142" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#8A8A8A" text-anchor="start">•</text><text x="152" y="141" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">21-hydroxylase deficient CAH — 11-KT is the dominant circulating androgen</text><rect x="70" y="178" width="800" height="58" rx="12" fill="#E8E8E6"/><text x="112" y="216" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#8A8A8A" text-anchor="start">•</text><text x="152" y="215" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Cushing's disease — high ACTH drives CYP11B1 overexpression</text><rect x="70" y="252" width="800" height="58" rx="12" fill="#E8E8E6"/><text x="112" y="290" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#8A8A8A" text-anchor="start">•</text><text x="152" y="289" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">PCOS — insulin-driven AKR1C3 in fat tissue</text><text x="470" y="360" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="middle">Proof that this pathway can carry the whole androgen load.</text></svg>