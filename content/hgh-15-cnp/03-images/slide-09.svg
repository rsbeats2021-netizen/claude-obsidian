<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 348" width="940" height="348"><rect width="940" height="348" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Which zone the knockouts lost</text><text x="470" y="82" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">Degree of reduction in cartilage-specific CNP or GC-B knockout mice</text><text x="90" y="128" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Hypertrophic layer</text><rect x="90" y="140" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="140" width="545" height="42" rx="12" fill="#E0243B"/><text x="710" y="170" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">drastically reduced</text><text x="90" y="214" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Proliferative layer</text><rect x="90" y="226" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="226" width="245" height="42" rx="12" fill="#E8A33D"/><text x="710" y="256" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">moderately reduced</text><text x="470" y="328" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="middle">CNP works mainly on hypertrophy, the strongest lever in the plate.</text></svg>