<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#EDEDEA"/><text x="470" y="52" font-family="Figtree,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#141414" text-anchor="middle">Hand bone vs leg bone, at one week</text><text x="90" y="130" font-family="Figtree,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#141414" text-anchor="start">Bone growth rate</text><rect x="90" y="152" width="760" height="58" rx="12" fill="#DAD8D2"/><rect x="90" y="152" width="760" height="58" rx="12" fill="#1B4DE4" opacity="0.16"/><rect x="90" y="152" width="372" height="58" rx="12" fill="#E0243B"/><text x="110" y="192" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="start">49% of the tibia</text><text x="90" y="290" font-family="Figtree,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#141414" text-anchor="start">Proliferation per column</text><rect x="90" y="312" width="760" height="58" rx="12" fill="#DAD8D2"/><rect x="90" y="312" width="760" height="58" rx="12" fill="#1B4DE4" opacity="0.16"/><rect x="90" y="312" width="349" height="58" rx="12" fill="#E0243B"/><text x="110" y="352" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="start">46% of the tibia</text><text x="470" y="478" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#141414" text-anchor="middle">The metacarpal grows at roughly half the speed.</text></svg>