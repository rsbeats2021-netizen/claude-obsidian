<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">How the cholinergic lever reaches GH</text><rect x="60" y="150" width="170" height="130" rx="12" fill="#E8E8E6"/><text x="145" y="200" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">PYRIDOSTIGMINE</text><text x="145" y="232" font-family="Figtree,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#8A8A8A" text-anchor="middle">blocks cholinesterase</text><line x1="238" y1="215" x2="268" y2="215" stroke="#141414" stroke-width="5" stroke-linecap="round"/><path d="M268 215 L258 207 M268 215 L258 223" stroke="#141414" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="276" y="150" width="170" height="130" rx="12" fill="#E8E8E6"/><text x="361" y="200" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">ACETYLCHOLINE</text><text x="361" y="232" font-family="Figtree,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#1B4DE4" text-anchor="middle">rises</text><line x1="454" y1="215" x2="484" y2="215" stroke="#141414" stroke-width="5" stroke-linecap="round"/><path d="M484 215 L474 207 M484 215 L474 223" stroke="#141414" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="492" y="150" width="170" height="130" rx="12" fill="#E8E8E6"/><text x="577" y="200" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">SOMATOSTATIN</text><text x="577" y="232" font-family="Figtree,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#E0243B" text-anchor="middle">falls</text><line x1="670" y1="215" x2="700" y2="215" stroke="#141414" stroke-width="5" stroke-linecap="round"/><path d="M700 215 L690 207 M700 215 L690 223" stroke="#141414" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="708" y="150" width="170" height="130" rx="12" fill="#E8E8E6"/><text x="793" y="200" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">GH PULSE</text><text x="793" y="232" font-family="Figtree,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#1E8E4A" text-anchor="middle">larger</text><text x="470" y="350" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="middle">Cholinergic tone is one of the inputs that lowers hypothalamic somatostatin.</text></svg>