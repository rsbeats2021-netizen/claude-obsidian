<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 326" width="940" height="326"><rect width="940" height="326" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Side effects do not plateau</text><text x="90" y="106" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Hair loss under 0.5 mg/kg/day</text><rect x="90" y="118" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="118" width="300" height="42" rx="12" fill="#8A8A8A"/><text x="710" y="148" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">3.2%</text><text x="90" y="192" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Hair loss at or above 0.5</text><rect x="90" y="204" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="204" width="534" height="42" rx="12" fill="#E0243B"/><text x="710" y="234" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">5.7%</text><text x="470" y="306" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="middle">Efficacy flattens. The side effect curve keeps climbing.</text></svg>