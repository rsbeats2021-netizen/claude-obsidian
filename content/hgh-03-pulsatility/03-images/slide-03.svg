<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="44" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Same daily dose. Two delivery patterns.</text><text x="90" y="112" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#8A8A8A" text-anchor="start">CONTINUOUS</text><rect x="90" y="128" width="760" height="86" rx="12" fill="#E8E8E6"/><path d="M100 185 L840 185" stroke="#8A8A8A" stroke-width="7" stroke-linecap="round"/><text x="470" y="160" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">steady level, never drops</text><text x="90" y="268" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#E0243B" text-anchor="start">PULSATILE</text><rect x="90" y="284" width="760" height="120" rx="12" fill="#E6D6D6"/><path d="M112 386 L120 304 L128 386 M204 386 L212 304 L220 386 M296 386 L304 304 L312 386 M388 386 L396 304 L404 386 M480 386 L488 304 L496 386 M572 386 L580 304 L588 386 M664 386 L672 304 L680 386 M756 386 L764 304 L772 386" stroke="#E0243B" stroke-width="6" fill="none" stroke-linejoin="round"/><line x1="100" y1="386" x2="840" y2="386" stroke="#8A8A8A" stroke-width="3"/><text x="470" y="316" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#E0243B" text-anchor="middle">8 pulses a day, 5 minutes each, every 3 hours</text><text x="470" y="456" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#141414" text-anchor="middle">Identical total hormone. Only the shape differs.</text><text x="470" y="500" font-family="Figtree,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#8A8A8A" text-anchor="middle">Clark 1985, Isgaard 1988, Bick 1992. Hypophysectomised rats.</text></svg>