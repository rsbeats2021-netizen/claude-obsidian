<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 434" width="940" height="434"><rect width="940" height="434" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Days for one reserve-cell division (rat)</text><text x="470" y="82" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">Hunziker et al. 1994</text><text x="90" y="128" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Untreated</text><rect x="90" y="140" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="140" width="576" height="42" rx="12" fill="#8A8A8A"/><text x="710" y="170" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">50 days</text><text x="90" y="214" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">With IGF-1</text><rect x="90" y="226" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="226" width="173" height="42" rx="12" fill="#1B4DE4"/><text x="710" y="256" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">15 days</text><text x="90" y="300" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">With GH</text><rect x="90" y="312" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="312" width="92" height="42" rx="12" fill="#E0243B"/><text x="710" y="342" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">8 days</text><text x="470" y="414" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="middle">Speed up the reserve layer and the whole plate produces more.</text></svg>