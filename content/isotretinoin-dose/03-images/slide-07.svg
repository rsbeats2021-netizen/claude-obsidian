<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 348" width="940" height="348"><rect width="940" height="348" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">19,907 patients followed after a course</text><text x="470" y="82" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">Lai &amp; Barbieri 2025, JAMA Dermatology</text><text x="90" y="128" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Relapsed</text><rect x="90" y="140" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="140" width="540" height="42" rx="12" fill="#E0243B"/><text x="710" y="170" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">22.5%</text><text x="90" y="214" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Went back for a second course</text><rect x="90" y="226" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="226" width="196" height="42" rx="12" fill="#E8A33D"/><text x="710" y="256" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">8.2%</text><text x="470" y="328" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="middle">Then they asked which part of the dosing predicted it.</text></svg>