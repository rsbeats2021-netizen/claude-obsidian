<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="60" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">The authors' conclusion</text><rect x="60" y="110" width="820" height="322" rx="12" fill="#EFE6C8"/><text x="470" y="162" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">"These findings suggest that the marked sebostatic</text><text x="470" y="204" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">effect of isotretinoin may not be the sole</text><text x="470" y="246" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">explanation for its mechanism of action in</text><text x="470" y="288" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">reducing the severity of acne."</text><text x="470" y="330" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle"></text><text x="470" y="372" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">Visible in 1982. Still reported as if sebum is the story.</text><text x="470" y="474" font-family="Figtree,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#8A8A8A" text-anchor="middle">Goldstein et al. 1982, Arch Dermatol.</text></svg>