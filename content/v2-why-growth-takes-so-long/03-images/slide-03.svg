<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500"><rect width="940" height="500" fill="#EDEDEA"/><text x="470.0" y="52" font-family="Figtree,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#141414" text-anchor="middle">Why the growth plate is energy limited</text><rect x="120" y="96" width="700" height="66" rx="12" fill="#DAD8D2"/><text x="470.0" y="140" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#141414" text-anchor="middle">No blood vessels in the plate</text><path d="M470.0,166 L470.0,184" stroke="#141414" stroke-width="5"/><path d="M459.0,178 L470.0,190 L481.0,178" fill="#141414"/><rect x="120" y="192" width="700" height="66" rx="12" fill="#DAD8D2"/><text x="470.0" y="236" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#141414" text-anchor="middle">No oxygen delivery</text><path d="M470.0,262 L470.0,280" stroke="#141414" stroke-width="5"/><path d="M459.0,274 L470.0,286 L481.0,274" fill="#141414"/><rect x="120" y="288" width="700" height="66" rx="12" fill="#E0243B"/><text x="470.0" y="332" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#EDEDEA" text-anchor="middle">Glycolysis instead: 2 ATP</text><path d="M470.0,358 L470.0,376" stroke="#141414" stroke-width="5"/><path d="M459.0,370 L470.0,382 L481.0,370" fill="#141414"/><rect x="120" y="384" width="700" height="66" rx="12" fill="#1B4DE4"/><text x="470.0" y="428" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#EDEDEA" text-anchor="middle">Oxidative would give 32 ATP</text></svg>