<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="46" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">24 weeks of jumping, short-stature children</text><text x="300" y="100" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#8A8A8A" text-anchor="middle">SERUM IGF-1</text><text x="700" y="100" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#8A8A8A" text-anchor="middle">SERUM GH</text><text x="90" y="180" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Controls</text><rect x="230" y="152" width="98" height="54" rx="12" fill="#8A8A8A"/><rect x="600" y="152" width="114" height="54" rx="12" fill="#8A8A8A"/><text x="90" y="284" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Jumping group</text><rect x="230" y="256" width="167" height="54" rx="12" fill="#1E8E4A"/><rect x="600" y="256" width="115" height="54" rx="12" fill="#8A8A8A"/><text x="300" y="376" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#1E8E4A" text-anchor="middle">higher, p &lt; 0.05</text><text x="700" y="376" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#8A8A8A" text-anchor="middle">no significant difference</text><text x="470" y="440" font-family="Figtree,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#141414" text-anchor="middle">Height rose. IGF-1 rose. GH did not move.</text><text x="470" y="492" font-family="Figtree,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#8A8A8A" text-anchor="middle">Wang et al. 2025, BMC Pediatrics. Bars schematic; significance as reported.</text></svg>