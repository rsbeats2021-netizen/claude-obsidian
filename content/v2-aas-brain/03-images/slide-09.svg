<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#EDEDEA"/><text x="470.0" y="52" font-family="Figtree,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#141414" text-anchor="middle">What has actually been tested</text><rect x="90" y="96" width="760" height="82" rx="12" fill="#DAD8D2"/><rect x="90" y="96" width="14" height="82" rx="7" fill="#1B4DE4"/><text x="130" y="132" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#141414" text-anchor="start">Exercise</text><text x="130" y="162" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#8A8A8A" text-anchor="start">reversed nandrolone damage in rats, measured 3 ways</text><rect x="90" y="200" width="760" height="82" rx="12" fill="#DAD8D2"/><rect x="90" y="200" width="14" height="82" rx="7" fill="#8A8A8A"/><text x="130" y="236" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#141414" text-anchor="start">Cerebrolysin</text><text x="130" y="266" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#8A8A8A" text-anchor="start">NGF, BDNF, CNTF fragments. right target, no trial</text><rect x="90" y="304" width="760" height="82" rx="12" fill="#DAD8D2"/><rect x="90" y="304" width="14" height="82" rx="7" fill="#8A8A8A"/><text x="130" y="340" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#141414" text-anchor="start">9-Me-BC</text><text x="130" y="370" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#8A8A8A" text-anchor="start">raises astrocyte neurotrophic factors</text><rect x="90" y="408" width="760" height="82" rx="12" fill="#DAD8D2"/><rect x="90" y="408" width="14" height="82" rx="7" fill="#8A8A8A"/><text x="130" y="444" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#141414" text-anchor="start">Memantine</text>