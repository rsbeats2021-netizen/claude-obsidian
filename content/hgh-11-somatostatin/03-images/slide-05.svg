<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520"><rect width="940" height="520" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Two GHRH stimuli, 90 minutes apart</text><text x="470" y="82" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">Spoudeas et al. 1992. Schematic heights, directions as reported.</text><text x="90" y="128" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Saline background: 1st</text><rect x="90" y="140" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="140" width="571" height="42" rx="12" fill="#8A8A8A"/><text x="710" y="170" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">full response</text><text x="90" y="214" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Saline background: 2nd</text><rect x="90" y="226" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="226" width="554" height="42" rx="12" fill="#8A8A8A"/><text x="710" y="256" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">no attenuation</text><text x="90" y="300" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Somatostatin: 1st</text><rect x="90" y="312" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="312" width="314" height="42" rx="12" fill="#E0243B"/><text x="710" y="342" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">blunted</text><text x="90" y="386" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Somatostatin: 2nd</text><rect x="90" y="398" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="398" width="171" height="42" rx="12" fill="#E0243B"/><text x="710" y="428" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">blunted further</text><text x="470" y="500" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="middle">Their conclusion: the GH response to GHRH is dependent on somatostatin tone.</text></svg>