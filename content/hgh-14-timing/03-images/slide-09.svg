<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550"><rect width="940" height="550" fill="#F4F4F2"/><text x="470" y="52" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">What the evidence supports</text><rect x="70" y="104" width="800" height="60" rx="12" fill="#DDEDE2"/><text x="112" y="144" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="154" y="142" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="start">GHRH plus a GHS is the most potent GH releaser known</text><rect x="70" y="182" width="800" height="60" rx="12" fill="#DDEDE2"/><text x="112" y="222" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="154" y="220" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="start">Somatostatin gates both of them</text><rect x="70" y="260" width="800" height="60" rx="12" fill="#DDEDE2"/><text x="112" y="300" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="154" y="298" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="start">Exogenous GH raises that gate for hours</text><rect x="70" y="338" width="800" height="60" rx="12" fill="#DDEDE2"/><text x="112" y="378" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="154" y="376" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="start">The ghrelin arm fatigues, the GHRH arm does not</text><rect x="70" y="416" width="800" height="60" rx="12" fill="#F2DEDE"/><text x="112" y="456" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#E0243B" text-anchor="start">✕</text><text x="154" y="454" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="start">Any specific daily schedule for growth</text><text x="470" y="528" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="middle">Four mechanisms are solid. The schedule is not.</text></svg>