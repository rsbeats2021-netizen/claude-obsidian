<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#141414" text-anchor="middle">Days for one reserve-cell division (rat)</text><text x="90" y="114" font-family="Figtree,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#141414" text-anchor="start">Untreated</text><rect x="90" y="128" width="760" height="52" rx="12" fill="#DAD8D2"/><rect x="90" y="128" width="760" height="52" rx="12" fill="#8A8A8A"/><text x="866" y="162" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">50 days</text><text x="90" y="224" font-family="Figtree,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#141414" text-anchor="start">IGF-1</text><rect x="90" y="238" width="760" height="52" rx="12" fill="#DAD8D2"/><rect x="90" y="238" width="228" height="52" rx="12" fill="#1B4DE4"/><text x="334" y="272" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">15 days</text><text x="90" y="334" font-family="Figtree,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#141414" text-anchor="start">GH</text><rect x="90" y="348" width="760" height="52" rx="12" fill="#DAD8D2"/><rect x="90" y="348" width="121" height="52" rx="12" fill="#E0243B"/><text x="227" y="382" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">8 days</text><text x="470" y="470" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#141414" text-anchor="middle">Both speed the reserve layer up. GH speeds it up more.</text><text x="470" y="502" font-family="Figtree,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#8A8A8A" text-anchor="middle">Hunziker et al. 1994. Rat.</text></svg>