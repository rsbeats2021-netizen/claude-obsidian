<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="60" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">What this is in the literature</text><rect x="60" y="110" width="820" height="322" rx="12" fill="#EFE6C8"/><text x="470" y="162" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">Every human study here uses pyridostigmine as a</text><text x="470" y="204" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">RESEARCH PROBE, to ask how much somatostatin</text><text x="470" y="246" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">is holding GH down. That is the pyridostigmine test.</text><text x="470" y="288" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle"></text><text x="470" y="330" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">It is not studied as a growth protocol.</text><text x="470" y="372" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">Mechanism: established. Application: untested.</text></svg>