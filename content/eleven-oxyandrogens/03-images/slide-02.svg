<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">What a standard panel measures</text><rect x="70" y="92" width="400" height="300" rx="12" fill="#E8E8E6"/><text x="270" y="134" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#141414" text-anchor="middle">MEASURED</text><text x="270" y="184" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1B4DE4" text-anchor="middle">Testosterone</text><text x="270" y="226" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">sometimes DHT</text><text x="270" y="268" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">the classical pathway</text><rect x="490" y="92" width="400" height="300" rx="12" fill="#DDEDE2"/><text x="690" y="134" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#141414" text-anchor="middle">NOT MEASURED</text><text x="690" y="184" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#E0243B" text-anchor="middle">11-ketotestosterone</text><text x="690" y="226" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">the whole 11-oxy class</text><text x="690" y="268" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">same receptor</text><text x="470" y="448" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="middle">An entire androgen family that does not appear on your results.</text></svg>