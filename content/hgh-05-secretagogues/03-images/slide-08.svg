<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="52" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Reading a secretagogue honestly</text><rect x="70" y="104" width="800" height="60" rx="12" fill="#DDEDE2"/><text x="112" y="144" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="154" y="142" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="start">Produces genuinely pulsatile GH</text><rect x="70" y="182" width="800" height="60" rx="12" fill="#DDEDE2"/><text x="112" y="222" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="154" y="220" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="start">That is the pattern the growth plate responds to</text><rect x="70" y="260" width="800" height="60" rx="12" fill="#F2DEDE"/><text x="112" y="300" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#E0243B" text-anchor="start">✕</text><text x="154" y="298" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="start">Holds its day-one magnitude</text><rect x="70" y="338" width="800" height="60" rx="12" fill="#E8E8E6"/><text x="112" y="378" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#8A8A8A" text-anchor="start">•</text><text x="154" y="376" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="start">Bone effect is size, not density</text></svg>