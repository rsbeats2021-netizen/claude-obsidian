<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 412" width="940" height="412"><rect width="940" height="412" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Growth rate, first year on study</text><text x="90" y="106" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Before study, both groups</text><rect x="90" y="118" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="118" width="463" height="42" rx="12" fill="#8A8A8A"/><text x="710" y="148" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">8.5 cm/yr</text><text x="90" y="192" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Standard dose 0.3</text><rect x="90" y="204" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="204" width="447" height="42" rx="12" fill="#1B4DE4"/><text x="710" y="234" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">8.2 cm/yr</text><text x="90" y="278" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">High dose 0.7</text><rect x="90" y="290" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="290" width="534" height="42" rx="12" fill="#E0243B"/><text x="710" y="320" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">9.8 cm/yr</text><text x="470" y="392" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="middle">P = 0.001 between groups. A real difference, and a small one.</text></svg>