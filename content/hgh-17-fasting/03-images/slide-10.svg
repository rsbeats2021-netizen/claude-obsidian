<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="60" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">The counterexample worth knowing</text><rect x="60" y="110" width="820" height="322" rx="12" fill="#EFE6C8"/><text x="470" y="162" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">A 2-year human trial of 25% calorie restriction in adults</text><text x="470" y="204" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">found that sustained restriction did NOT significantly</text><text x="470" y="246" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">lower IGF-1.</text><text x="470" y="288" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle"></text><text x="470" y="330" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">The authors attributed it to the trial's high protein intake.</text><text x="470" y="372" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">Calories alone do not settle it.</text></svg>