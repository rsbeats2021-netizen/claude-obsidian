<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="60" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">The rodent consequence</text><rect x="60" y="110" width="820" height="322" rx="12" fill="#EFE6C8"/><text x="470" y="162" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">In a rat cerebral ischemia model, letrozole</text><text x="470" y="204" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">increased infarct volume and caused seizures</text><text x="470" y="246" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">in intact male rats.</text><text x="470" y="288" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle"></text><text x="470" y="330" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">One rodent model, one acute insult. Not a</text><text x="470" y="372" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">prediction about a healthy person.</text></svg>