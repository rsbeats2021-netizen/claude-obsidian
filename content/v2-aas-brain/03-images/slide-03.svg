<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#EDEDEA"/><text x="470.0" y="52" font-family="Figtree,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#141414" text-anchor="middle">How each compound kills neurons</text><rect x="90" y="96" width="760" height="82" rx="12" fill="#DAD8D2"/><rect x="90" y="96" width="14" height="82" rx="7" fill="#E0243B"/><text x="130" y="132" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#141414" text-anchor="start">Trenbolone</text><text x="130" y="162" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#8A8A8A" text-anchor="start">apoptosis, neurite outgrowth down, Tubb3 down</text><rect x="90" y="200" width="760" height="82" rx="12" fill="#DAD8D2"/><rect x="90" y="200" width="14" height="82" rx="7" fill="#E0243B"/><text x="130" y="236" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#141414" text-anchor="start">Nandrolone</text><text x="130" y="266" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#8A8A8A" text-anchor="start">apoptosis, mitochondria hit by 24h</text><rect x="90" y="304" width="760" height="82" rx="12" fill="#DAD8D2"/><rect x="90" y="304" width="14" height="82" rx="7" fill="#1B4DE4"/><text x="130" y="340" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#141414" text-anchor="start">Testosterone</text><text x="130" y="370" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#8A8A8A" text-anchor="start">apoptosis, but aromatises to protection</text><rect x="90" y="408" width="760" height="82" rx="12" fill="#DAD8D2"/><rect x="90" y="408" width="14" height="82" rx="7" fill="#8A8A8A"/><text x="130" y="444" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#141414" text-anchor="start">Stanozolol</text><text x="130" y="474" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#8A8A8A" text-anchor="start">necrosis instead, inflammatory</text></svg>