<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="60" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">The authors' own caveat</text><rect x="60" y="110" width="820" height="280" rx="12" fill="#EFE6C8"/><text x="470" y="162" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">"It is not known whether final adult height will be</text><text x="470" y="204" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">increased, or what the harms of long-term therapy</text><text x="470" y="246" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">might be."</text><text x="470" y="288" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle"></text><text x="470" y="330" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">Growth velocity over one year is not adult height.</text><text x="470" y="432" font-family="Figtree,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#8A8A8A" text-anchor="middle">Savarirayan et al. 2020, Lancet.</text></svg>