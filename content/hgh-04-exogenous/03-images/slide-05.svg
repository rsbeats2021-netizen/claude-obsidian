<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="46" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Loveridge 1995: block GH and watch both numbers</text><text x="250" y="104" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#8A8A8A" text-anchor="middle">GROWTH PLATE WIDTH</text><text x="690" y="104" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#8A8A8A" text-anchor="middle">SERUM IGF-1</text><text x="90" y="176" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Control</text><rect x="250" y="146" width="230" height="52" rx="12" fill="#8A8A8A"/><rect x="560" y="146" width="223" height="52" rx="12" fill="#1B4DE4"/><text x="800" y="180" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">10.7 nmol/l</text><text x="90" y="272" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">GH blocked</text><rect x="250" y="242" width="142" height="52" rx="12" fill="#E0243B"/><rect x="560" y="242" width="215" height="52" rx="12" fill="#1B4DE4"/><text x="800" y="276" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">10.3 nmol/l</text><text x="470" y="372" font-family="Figtree,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#141414" text-anchor="middle">The plate narrowed. The blood number did not move.</text><rect x="70" y="400" width="800" height="80" rx="12" fill="#EFE6C8"/><text x="470" y="432" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="middle">"Circulating total IGF-I concentrations were unchanged in the rats</text><text x="470" y="460" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="middle">given the GH antiserum."</text><text x="470" y="508" font-family="Figtree,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#8A8A8A" text-anchor="middle">Plate-width bars are schematic; IGF-1 bars are the reported values.</text></svg>