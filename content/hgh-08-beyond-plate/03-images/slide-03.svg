<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="46" font-family="Figtree,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#141414" text-anchor="middle">Bone grows in two directions</text><rect x="110" y="100" width="250" height="330" rx="12" fill="#E8E8E6"/><text x="235" y="136" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="middle">LENGTH</text><text x="235" y="164" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">growth plate</text><rect x="200" y="196" width="70" height="170" rx="30" fill="#1B4DE4" opacity="0.35"/><rect x="200" y="196" width="70" height="26" rx="13" fill="#1B4DE4"/><rect x="200" y="340" width="70" height="26" rx="13" fill="#1B4DE4"/><text x="235" y="404" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#E0243B" text-anchor="middle">closes at fusion</text><rect x="580" y="100" width="250" height="330" rx="12" fill="#DDEDE2"/><text x="705" y="136" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="middle">WIDTH</text><text x="705" y="164" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">periosteum</text><rect x="652" y="196" width="106" height="170" rx="30" fill="#1E8E4A" opacity="0.25"/><rect x="670" y="196" width="70" height="170" rx="30" fill="#1E8E4A" opacity="0.55"/><text x="705" y="404" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#1E8E4A" text-anchor="middle">no closing date</text><text x="470" y="478" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="middle">GH keeps working on the right-hand process after the plates fuse.</text></svg>