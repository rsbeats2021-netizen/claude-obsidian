<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" width="940" height="490"><rect width="940" height="490" fill="#F4F4F2"/><text x="470" y="52" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">What holds up</text><rect x="70" y="104" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="142" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="141" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Sebum suppression is real, around 88%</text><rect x="70" y="178" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="216" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="215" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">It is not the full mechanism, by the authors' own conclusion</text><rect x="70" y="252" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="290" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="289" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Daily dose plateaus for efficacy but not for side effects</text><rect x="70" y="326" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="364" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="363" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Relapse tracks cumulative total, in nearly 20,000 people</text><rect x="70" y="400" width="800" height="58" rx="12" fill="#F2DEDE"/><text x="112" y="438" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#E0243B" text-anchor="start">✕</text><text x="152" y="437" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">A higher daily dose lowers your relapse risk</text></svg>