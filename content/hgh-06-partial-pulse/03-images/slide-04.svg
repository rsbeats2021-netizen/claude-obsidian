<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="46" font-family="Figtree,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#141414" text-anchor="middle">One total dose, three delivery patterns</text><text x="470" y="82" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">Growth response (Gevers 1996, rat)</text><text x="90" y="126" font-family="Figtree,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#141414" text-anchor="start">All continuous</text><text x="850" y="126" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#8A8A8A" text-anchor="end">72c</text><rect x="90" y="142" width="760" height="52" rx="12" fill="#DAD8D2"/><rect x="90" y="142" width="258" height="52" rx="12" fill="#8A8A8A"/><text x="90" y="244" font-family="Figtree,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#141414" text-anchor="start">Half pulsed, half flat</text><text x="850" y="244" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#8A8A8A" text-anchor="end">36p + 36c</text><rect x="90" y="260" width="760" height="52" rx="12" fill="#DAD8D2"/><rect x="90" y="260" width="516" height="52" rx="12" fill="#1B4DE4"/><text x="90" y="362" font-family="Figtree,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#141414" text-anchor="start">All pulsed</text><text x="850" y="362" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#8A8A8A" text-anchor="end">72p</text><rect x="90" y="378" width="760" height="52" rx="12" fill="#DAD8D2"/><rect x="90" y="378" width="760" height="52" rx="12" fill="#E0243B"/><text x="470" y="482" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">More effective than all-continuous. Less effective than all-pulsed. P &lt; 0.05.</text><text x="470" y="512" font-family="Figtree,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#8A8A8A" text-anchor="middle">Bar lengths are schematic and show rank order, not measured magnitudes.</text></svg>