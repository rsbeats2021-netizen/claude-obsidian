<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 434" width="940" height="434"><rect width="940" height="434" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">How much AKR1C3 prefers this pathway</text><text x="470" y="82" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">Relative enzymatic efficiency. Barnard et al. 2018.</text><text x="90" y="128" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">11-ketoandrostenedione</text><rect x="90" y="140" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="140" width="553" height="42" rx="12" fill="#1E8E4A"/><text x="710" y="170" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">the preferred substrate</text><text x="90" y="214" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Androstenedione (classical)</text><rect x="90" y="226" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="226" width="69" height="42" rx="12" fill="#8A8A8A"/><text x="710" y="256" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">8x less efficient</text><text x="90" y="300" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">5α-androstanedione</text><rect x="90" y="312" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="312" width="23" height="42" rx="12" fill="#8A8A8A"/><text x="710" y="342" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">24x less efficient</text><text x="470" y="414" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="middle">The classical pathways are the ones limited by low catalytic efficiency.</text></svg>