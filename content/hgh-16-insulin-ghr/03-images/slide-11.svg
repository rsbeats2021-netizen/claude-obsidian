<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="52" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">What your serum IGF-1 is actually reporting</text><rect x="70" y="104" width="800" height="58" rx="12" fill="#E8E8E6"/><text x="112" y="142" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#8A8A8A" text-anchor="start">•</text><text x="152" y="141" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Your GH dose</text><rect x="70" y="178" width="800" height="58" rx="12" fill="#E8E8E6"/><text x="112" y="216" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#8A8A8A" text-anchor="start">•</text><text x="152" y="215" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">How much insulin your liver is seeing</text><rect x="70" y="252" width="800" height="58" rx="12" fill="#E8E8E6"/><text x="112" y="290" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#8A8A8A" text-anchor="start">•</text><text x="152" y="289" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">The route anything you take reaches the liver by</text><rect x="70" y="326" width="800" height="58" rx="12" fill="#E8E8E6"/><text x="112" y="364" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#8A8A8A" text-anchor="start">•</text><text x="152" y="363" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Your body composition</text><rect x="70" y="400" width="800" height="58" rx="12" fill="#E8E8E6"/><text x="112" y="438" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#8A8A8A" text-anchor="start">•</text><text x="152" y="437" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Your pubertal stage</text><text x="470" y="508" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="middle">Five inputs. One of them is the dose.</text></svg>