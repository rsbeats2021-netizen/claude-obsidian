<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 786" width="940" height="786"><rect width="940" height="786" fill="#F4F4F2"/><text x="470" y="52" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">The nine, in one place</text><rect x="70" y="104" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="142" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="141" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Isaksson 1982 — one leg grew, same blood</text><rect x="70" y="178" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="216" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="215" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Loveridge 1995 — plate shrank, marker flat</text><rect x="70" y="252" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="290" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="289" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Hunziker 1994 — lower IGF-1, more growth</text><rect x="70" y="326" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="364" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="363" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Bick 1992 — higher IGF-1, less growth</text><rect x="70" y="400" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="438" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="437" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Lui 2010 — same molecule, location decided it</text><rect x="70" y="474" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="512" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="511" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Wang 2025 — IGF-1 up, GH unchanged</text><rect x="70" y="548" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="586" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="585" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Fasting — GH up, IGF-1 and growth down</text><rect x="70" y="622" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="660" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="659" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Ly 2020 — one dose, the whole IGF-1 range</text><rect x="70" y="696" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="734" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="733" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Olney 2006 — another pathway, GH resistance</text></svg>