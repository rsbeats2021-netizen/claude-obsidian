<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="46" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Bick 1992: same dose, opposite directions</text><text x="250" y="110" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#8A8A8A" text-anchor="middle">SERUM IGF-1</text><text x="690" y="110" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#8A8A8A" text-anchor="middle">ACTUAL GROWTH</text><text x="90" y="182" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Continuous</text><rect x="300" y="156" width="144" height="50" rx="12" fill="#1B4DE4"/><rect x="620" y="156" width="64" height="50" rx="12" fill="#1B4DE4"/><text x="90" y="266" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Pulsatile</text><rect x="300" y="240" width="80" height="50" rx="12" fill="#E0243B"/><rect x="620" y="240" width="160" height="50" rx="12" fill="#E0243B"/><text x="470" y="350" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#141414" text-anchor="middle">Continuous won on the blood marker.</text><text x="470" y="388" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#E0243B" text-anchor="middle">Pulsatile won on actual growth.</text><rect x="70" y="416" width="800" height="74" rx="12" fill="#EFE6C8"/><text x="470" y="448" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="middle">"Receptor, GH-BP, and IGF-I are stimulated more by continuous</text><text x="470" y="474" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="middle">GH delivery, whereas growth is enhanced more by pulsatility."</text><text x="470" y="508" font-family="Figtree,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#8A8A8A" text-anchor="middle">Bars show direction of effect, not measured magnitudes.</text></svg>