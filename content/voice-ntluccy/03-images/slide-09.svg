<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="52" font-family="Figtree,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#141414" text-anchor="middle">How far through the process each bone is</text><text x="90" y="130" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#141414" text-anchor="start">Hand and wrist</text><rect x="90" y="148" width="760" height="56" rx="12" fill="#DAD8D2"/><rect x="90" y="148" width="653" height="56" rx="12" fill="#E0243B"/><text x="729" y="185" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="end">used</text><text x="850" y="185" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="end">left</text><text x="90" y="280" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#141414" text-anchor="start">Femur and tibia</text><rect x="90" y="298" width="760" height="56" rx="12" fill="#DAD8D2"/><rect x="90" y="298" width="319" height="56" rx="12" fill="#1B4DE4"/><text x="395" y="335" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="end">used</text><text x="850" y="335" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="end">left</text><text x="470" y="470" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#141414" text-anchor="middle">The X-ray reads the red bar to estimate the blue one.</text><text x="470" y="500" font-family="Figtree,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#8A8A8A" text-anchor="middle">Illustrative, not to scale.</text></svg>