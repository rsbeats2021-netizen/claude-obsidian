<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">GH moves conversion on two axes</text><rect x="70" y="92" width="400" height="300" rx="12" fill="#E8E8E6"/><text x="270" y="134" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#141414" text-anchor="middle">THYROID</text><text x="270" y="184" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1E8E4A" text-anchor="middle">T4 converted to T3</text><text x="270" y="226" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">inactive to active</text><text x="270" y="268" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">more hormone action</text><rect x="490" y="92" width="400" height="300" rx="12" fill="#DDEDE2"/><text x="690" y="134" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#141414" text-anchor="middle">CORTISOL</text><text x="690" y="184" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1B4DE4" text-anchor="middle">Cortisol to cortisone</text><text x="690" y="226" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">active to inactive</text><text x="690" y="268" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">less hormone action</text><text x="470" y="448" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="middle">Both are conversion effects, not production effects.</text></svg>