<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 348" width="940" height="348"><rect width="940" height="348" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Then they refed</text><text x="470" y="82" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">Proximal tibial growth rate as a percentage of control</text><text x="90" y="128" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">7 days after the fast</text><rect x="90" y="140" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="140" width="480" height="42" rx="12" fill="#1E8E4A"/><text x="710" y="170" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">back to control</text><text x="90" y="214" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#141414" text-anchor="start">Rest of the experiment</text><rect x="90" y="226" width="600" height="42" rx="12" fill="#DAD8D2"/><rect x="90" y="226" width="542" height="42" rx="12" fill="#1E8E4A"/><text x="710" y="256" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">10-15% above control</text><text x="470" y="328" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#141414" text-anchor="middle">Catch-up did not stop at normal. It overshot and stayed there.</text></svg>