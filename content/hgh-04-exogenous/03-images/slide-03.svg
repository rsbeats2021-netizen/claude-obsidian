<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="46" font-family="Figtree,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#141414" text-anchor="middle">Isaksson 1982: one animal, two legs</text><text x="470" y="80" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">Hypophysectomised rat. No GH of its own.</text><text x="240" y="128" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">LEFT TIBIA</text><text x="240" y="154" font-family="Figtree,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#8A8A8A" text-anchor="middle">saline</text><rect x="210" y="180" width="60" height="200" rx="26" fill="#8A8A8A" opacity="0.30"/><rect x="210" y="180" width="60" height="26" rx="13" fill="#8A8A8A"/><rect x="210" y="354" width="60" height="26" rx="13" fill="#8A8A8A"/><text x="240" y="414" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#8A8A8A" text-anchor="middle">control</text><text x="660" y="128" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">RIGHT TIBIA</text><text x="660" y="154" font-family="Figtree,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#E0243B" text-anchor="middle">GH injected into the plate</text><rect x="630" y="180" width="60" height="268" rx="26" fill="#E0243B" opacity="0.30"/><rect x="630" y="180" width="60" height="26" rx="13" fill="#E0243B"/><rect x="630" y="422" width="60" height="26" rx="13" fill="#E0243B"/><text x="660" y="482" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#E0243B" text-anchor="middle">grew more</text><text x="470" y="502" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">Same bloodstream. Same circulating IGF-1 reaching both legs.</text></svg>