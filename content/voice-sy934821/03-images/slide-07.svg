<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#EDEDEA"/><text x="470" y="52" font-family="Figtree,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#141414" text-anchor="middle">What actually predicts growth plate fusion</text><text x="90" y="124" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#141414" text-anchor="start">Pubertal stage</text><rect x="90" y="138" width="760" height="46" rx="10" fill="#DAD8D2"/><rect x="90" y="138" width="456" height="46" rx="10" fill="#E0243B"/><text x="860" y="170" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="end">0.51 to 0.60</text><text x="90" y="236" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#141414" text-anchor="start">BMI</text><rect x="90" y="250" width="760" height="46" rx="10" fill="#DAD8D2"/><rect x="90" y="250" width="288" height="46" rx="10" fill="#1B4DE4"/><text x="860" y="282" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="end">0.19 to 0.38</text><text x="90" y="348" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#141414" text-anchor="start">Physical activity</text><rect x="90" y="362" width="760" height="46" rx="10" fill="#DAD8D2"/><text x="860" y="394" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#8A8A8A" text-anchor="end">0.095 at one site, otherwise none</text><text x="470" y="486" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#141414" text-anchor="middle">Training barely registered. Body composition did.</text></svg>