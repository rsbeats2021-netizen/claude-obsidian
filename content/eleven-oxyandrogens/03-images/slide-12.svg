<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 416" width="940" height="416"><rect width="940" height="416" fill="#F4F4F2"/><text x="470" y="52" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">What this changes</text><rect x="70" y="104" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="142" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="141" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">11-KT binds the same receptor as testosterone</text><rect x="70" y="178" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="216" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="215" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">It follows ACTH and insulin, not LH</text><rect x="70" y="252" width="800" height="58" rx="12" fill="#DDEDE2"/><text x="112" y="290" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="start">✓</text><text x="152" y="289" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">In some conditions it is the dominant androgen</text><rect x="70" y="326" width="800" height="58" rx="12" fill="#F2DEDE"/><text x="112" y="364" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#E0243B" text-anchor="start">✕</text><text x="152" y="363" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="start">Your standard panel reports it</text></svg>