<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="46" font-family="Figtree,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#141414" text-anchor="middle">Lui 2010: same molecule, different address</text><rect x="70" y="96" width="800" height="150" rx="12" fill="#E8E8E6"/><text x="100" y="138" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#141414" text-anchor="start">NON-TARGETED IGF-1</text><text x="100" y="172" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="start">free in circulation</text><text x="100" y="212" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#8A8A8A" text-anchor="start">no significant effect on growth</text><text x="840" y="182" font-family="Figtree,Helvetica,sans-serif" font-size="54" font-weight="800" fill="#8A8A8A" text-anchor="end">✕</text><rect x="70" y="276" width="800" height="150" rx="12" fill="#DDEDE2"/><text x="100" y="318" font-family="Figtree,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#141414" text-anchor="start">CARTILAGE-TARGETED IGF-1</text><text x="100" y="352" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="start">binds matrilin-3 at the plate</text><text x="100" y="392" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#1E8E4A" text-anchor="start">grew bone</text><text x="840" y="362" font-family="Figtree,Helvetica,sans-serif" font-size="54" font-weight="800" fill="#1E8E4A" text-anchor="end">✓</text><text x="470" y="480" font-family="Figtree,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#141414" text-anchor="middle">Identical drug. Only the delivery location differed.</text></svg>