lvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="start">Small for gestational age</text><rect x="430" y="324" width="95" height="46" rx="12" fill="#1B4DE4"/><text x="590" y="356" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">1.34</text><rect x="630" y="324" width="112" height="46" rx="12" fill="#E0243B"/><text x="790" y="356" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">1.57</text><text x="90" y="434" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="start">Turner syndrome</text><rect x="630" y="410" width="76" height="46" rx="12" fill="#E0243B"/><text x="790" y="442" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">1.07</text><text x="470" y="502" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#141414" text-anchor="middle">SDS, not centimetres. The deficient group gains about double the ISS group.</text></svg>