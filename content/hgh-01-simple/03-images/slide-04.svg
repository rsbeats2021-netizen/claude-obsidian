<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="48" font-family="Figtree,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#141414" text-anchor="middle">The two routes GH uses</text><rect x="60" y="90" width="200" height="86" rx="12" fill="#DAD8D2"/><text x="160" y="124" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">PITUITARY</text><text x="160" y="152" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#8A8A8A" text-anchor="middle">makes GH</text><line x1="268" y1="133" x2="350" y2="133" stroke="#141414" stroke-width="5" stroke-linecap="round"/><path d="M350 133 L337.1051460839596 138.4518567923211 M350 133 L337.1051460839596 127.54814320767889" stroke="#141414" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="358" y="90" width="200" height="86" rx="12" fill="#CFE0F5"/><text x="458" y="124" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">LIVER</text><text x="458" y="152" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#1B4DE4" text-anchor="middle">makes IGF-1</text><line x1="566" y1="133" x2="660" y2="133" stroke="#1B4DE4" stroke-width="5" stroke-linecap="round"/><path d="M660 133 L647.1051460839597 138.4518567923211 M660 133 L647.1051460839597 127.54814320767889" stroke="#1B4DE4" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="668" y="210" width="212" height="110" rx="12" fill="#E6D6D6"/><text x="774" y="252" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">GROWTH</text><text x="774" y="280" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#141414" text-anchor="middle">PLATE</text><text x="774" y="306" font-family="Figtree,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#8A8A8A" text-anchor="middle">bone lengthens</text><path d="M160 176 L160 265 L660 265" stroke="#E0243B" stroke-width="5" fill="none" stroke-linecap="round"/><line x1="640" y1="265" x2="660" y2="265" stroke="#E0243B" stroke-width="5" stroke-linecap="round"/><path d="M660 265 L647.1051460839597 270.4518567923211 M660 265 L647.1051460839597 259.5481432076789" stroke="#E0243B" stroke-width="5" stroke-linecap="round" fill="none"/><text x="360" y="300" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#E0243B" text-anchor="middle">route 2: GH acts directly on the plate</text><text x="470" y="408" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#141414" text-anchor="middle">Route 1 is what your blood test measures.</text><text x="470" y="444" font-family="Figtree,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#E0243B" text-anchor="middle">Route 2 is invisible on bloodwork.</text><text x="470" y="500" font-family="Figtree,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#8A8A8A" text-anchor="middle">Lundberg 2015: GH acts both directly at the growth plate and via IGF-1.</text></svg>