<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 528" width="940" height="528"><rect width="940" height="528" fill="#F4F4F2"/><text x="470" y="46" font-family="Figtree,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#141414" text-anchor="middle">Does GH run your bone age forward?</text><text x="470" y="84" font-family="Figtree,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#8A8A8A" text-anchor="middle">Nwosu 2021. 71 children, up to 14 years of therapy.</text><text x="470" y="132" font-family="Figtree,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#8A8A8A" text-anchor="middle">Bone age minus chronological age</text><line x1="150" y1="250" x2="790" y2="250" stroke="#8A8A8A" stroke-width="3"/><text x="150" y="286" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#8A8A8A" text-anchor="middle">-2</text><text x="470" y="286" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#8A8A8A" text-anchor="middle">0 = on schedule</text><text x="790" y="286" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#8A8A8A" text-anchor="middle">+2</text><circle cx="302" cy="250" r="14" fill="#8A8A8A"/><line x1="302" y1="250" x2="302" y2="220" stroke="#8A8A8A" stroke-width="3"/><text x="302" y="198" font-family="Figtree,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#8A8A8A" text-anchor="middle">-1.05</text><text x="302" y="172" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#141414" text-anchor="middle">at start</text><circle cx="360" cy="250" r="14" fill="#E0243B"/><line x1="360" y1="250" x2="360" y2="162" stroke="#E0243B" stroke-width="3"/><text x="360" y="140" font-family="Figtree,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#E0243B" text-anchor="middle">-0.69</text><text x="360" y="114" font-family="Figtree,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#141414" text-anchor="middle">at end of therapy</text><text x="470" y="350" font-family="Figtree,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#1E8E4A" text-anchor="middle">P = 0.09.  Not a significant change.</text><text x="470" y="404" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">Catch-up of ~1.5 months of bone age per year for the first 6.5 years,</text><text x="470" y="434" font-family="Figtree,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#141414" text-anchor="middle">then it plateaued.</text><text x="470" y="490" font-family="Figtree,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#8A8A8A" text-anchor="middle">Still negative at the end: these children were behind schedule and stayed behind.</text></svg>